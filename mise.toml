# What this checkout deploys into $HOME.
#
# `mise dot apply` reads this file when the command runs here. The `base` group
# is a home-relative tree: every file below base/ lands at the same path under
# ~/. Deployed files come from Git's index, so commit a file before applying
# it.
[settings]
dotfiles.root = "."

# Packages needed by the configs. lazygit already ships with Omarchy; declared
# here for the record, so a stripped-down box still gets it.
[bootstrap.packages]
"pacman:lazygit" = "latest"
"pacman:lazydocker" = "latest"
# delta renders lazygit's diff view (see base/.config/lazygit/config.yml).
"pacman:git-delta" = "latest"

[bootstrap]
dotfile_groups = ["base"]

[dotfile_groups.base]
root = "base"
manifest = "git"
